# Nginx Configuration for Next.js Dynamic Application
# Place this file in /etc/nginx/sites-available/ and create a symlink to sites-enabled

upstream nextjs_upstream {
  server 127.0.0.1:3000;
  keepalive 64;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name lecturedekho.in www.lecturedekho.in;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "origin-when-cross-origin" always;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

  # Root directory
  root /var/www/akgclass/.next;

  # Access and error logs
  access_log /var/log/nginx/akgclass-access.log;
  error_log /var/log/nginx/akgclass-error.log;

  # Static files caching
  location /_next/static {
    alias /var/www/akgclass/.next/static;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Public files
  location /static {
    alias /var/www/akgclass/public;
    expires 1y;
    access_log off;
  }

  # Images optimization
  location /_next/image {
    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Favicon and manifest
  location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
    root /var/www/akgclass/public;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Next.js application - proxy to Node.js
  location / {
    # Rate limiting
    limit_req zone=ratelimit burst=20 nodelay;

    proxy_pass http://nextjs_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

